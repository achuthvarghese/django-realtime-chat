# Lint (black, isort) and test (pytest) on every push and pull request.

name: Checks

on:
  pull_request:
    branches: ["master", "dev"]
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install "black>=24,<26" "isort>=5.13,<7"
      - name: Check formatting with black
        run: black --check --diff .
      - name: Check import order with isort
        if: ${{ always() }}
        run: isort --check --diff .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=realtime_chat.settings_test
      - name: Run Django system checks
        run: python manage.py check --settings=realtime_chat.settings_test
      - name: Run tests
        run: pytest
